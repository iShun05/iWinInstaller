name: Prueba del instalador inicial
on:
  push:
    branches: [main, 'codex/**']
    paths: ['install.ps1', 'apps.json', 'scripts/**', 'installer-header.bat', 'tests/check-bootstrap.ps1', 'tests/check-reliability.ps1', 'tests/check-public.ps1', 'iWinInstaller.ps1', '.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Paquete, copia y restauración segura
        shell: powershell
        run: ./tests/check-bootstrap.ps1
      - name: Escritorio, privacidad y actividad
        shell: powershell
        run: ./tests/check-public.ps1
      - name: Comprobaciones de instalación y actualización
        shell: powershell
        run: ./tests/check-reliability.ps1

name: Prueba del instalador inicial
on:
  push:
    branches: [main, 'codex/**']
    paths: ['lifecycle.ps1', 'install.ps1', 'apps.json', 'scripts/**', 'installer-header.bat', 'tests/check-bootstrap.ps1', 'tests/check-reliability.ps1', 'tests/check-audit.ps1', 'tests/check-lifecycle.ps1', 'tests/check-x86.ps1', 'tests/check-public.ps1', 'iWinInstaller.ps1', '.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Paquete, copia y restauración segura
        shell: powershell
        run: ./tests/check-bootstrap.ps1
      - name: Escritorio, privacidad y actividad
        shell: powershell
        run: ./tests/check-public.ps1
      - name: Comprobaciones de instalación y actualización
        shell: powershell
        run: ./tests/check-reliability.ps1
      - name: Inventario, versiones y fallos RGB
        shell: powershell
        run: ./tests/check-audit.ps1
      - name: Reanudar, pausar, restaurar y comprobar postinstalación
        shell: powershell
        run: ./tests/check-lifecycle.ps1
  x86:
    name: x86
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar PowerShell de 32 bits real
        shell: powershell
        run: |
          $x86=Join-Path $env:WINDIR 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          & $x86 -NoProfile -ExecutionPolicy Bypass -File ./tests/check-x86.ps1
          if($LASTEXITCODE){throw 'Falló la prueba x86'}

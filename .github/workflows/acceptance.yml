name: Aceptación real de instalación
on:
  push:
    branches: [main, 'codex/**']
    paths: ['*.ps1', 'apps.json', 'profiles.json', 'native/**', 'scripts/**', 'tests/**', 'installer-header.bat', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Instalar el BAT completo sin acceso a GitHub
        shell: powershell
        run: ./tests/check-embedded-install.ps1
      - name: Chrome desde cero, repetición e informe
        shell: powershell
        run: ./tests/check-acceptance.ps1
      - name: Consola y contrato del motor
        shell: powershell
        run: |
          $state = powershell -NoProfile -ExecutionPolicy Bypass -File ./iWinInstaller.ps1 -Check -Json | ConvertFrom-Json
          if ($state.contract -ne 1 -or -not $state.items.Count) { throw 'El estado en JSON no es válido' }
          $dir = Join-Path $env:RUNNER_TEMP 'iwin-contrato'; New-Item $dir -ItemType Directory -Force | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File ./iWinInstaller.ps1 -EngineCommand profiles.list -EngineResponse "$dir/r.json" -EngineEvents "$dir/e.jsonl"
          if ($LASTEXITCODE -ne 0 -or -not (Get-Content "$dir/r.json" -Raw | ConvertFrom-Json).builtIn.Count) { throw 'El motor no respondió al contrato' }
      - name: Conservar el diagnóstico de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aceptacion-windows-${{ matrix.os }}
          path: |
            tests/aceptacion.log
            ${{ runner.temp }}/iwin-aceptacion/
            ${{ runner.temp }}/iwin-ui/

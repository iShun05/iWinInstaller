name: Prueba en Windows
# Diagnóstico, no decide la publicación: instala de verdad desde internet y sus códigos de salida
# son informativos (p. ej. -Check sale con el número de apps que faltan). Las puertas de publicación
# son bootstrap, acceptance, native, x86 y unit, sin continue-on-error.
on:
  # Solo se prueba cuando cambia el código de la app.
  push:
    branches: [main]
    paths: ['lifecycle.ps1', 'iWinInstaller.ps1', 'src/engine/**', 'apps.json', 'profiles.json', 'install.ps1', 'tests/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sintaxis (PowerShell 5.1)
        shell: powershell
        run: |
          New-Item -ItemType Directory resultados -Force | Out-Null
          $e = $null
          [void][Management.Automation.Language.Parser]::ParseFile("$PWD\iWinInstaller.ps1", [ref]$null, [ref]$e)
          $r = @("errores de sintaxis: $(@($e).Count)") + @($e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" })
          Get-Content apps.json -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
          Get-Content profiles.json -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
          $r += 'JSON válidos'
          $r | Tee-Object resultados\1-sintaxis.txt
          if ($e) { exit 1 }
      - name: winget disponible
        shell: powershell
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          "winget $(winget --version)" | Tee-Object resultados\2-winget.txt
          winget source list 2>&1 | Tee-Object resultados\2-winget.txt -Append
      - name: Ids de winget del catálogo
        shell: powershell
        timeout-minutes: 30
        continue-on-error: true
        run: .\tests\check-ids.ps1 *>&1 | Tee-Object resultados\3-ids.txt
      - name: Informe -Check
        shell: powershell
        timeout-minutes: 20
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\iWinInstaller.ps1 -Check *>&1 | Tee-Object resultados\4-check.txt
          "Código de salida (faltan): $LASTEXITCODE" | Tee-Object resultados\4-check.txt -Append
      - name: Estado del PC (consola)
        shell: powershell
        timeout-minutes: 10
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\iWinInstaller.ps1 -Status *>&1 | Tee-Object resultados\6-estado.txt
          "Código: $LASTEXITCODE" | Tee-Object resultados\6-estado.txt -Append
      - name: Instalación sin ventana (perfil Optimización)
        shell: powershell
        timeout-minutes: 30
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\iWinInstaller.ps1 -Silent -Perfil "Solo sistema (ajustes y optimización)" *>&1 | Tee-Object resultados\5-instalacion.txt
          "Fallos: $LASTEXITCODE" | Tee-Object resultados\5-instalacion.txt -Append
      - name: Informe -Check tras instalar (detecta lo instalado)
        shell: powershell
        timeout-minutes: 20
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\iWinInstaller.ps1 -Check *>&1 | Tee-Object resultados\7-check-final.txt
          "Código de salida (faltan): $LASTEXITCODE" | Tee-Object resultados\7-check-final.txt -Append
      - name: Instalador (install.ps1 desde la última Release)
        shell: powershell
        timeout-minutes: 10
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Silent *>&1 | Tee-Object resultados\8-instalador.txt
          $d = Join-Path $env:LOCALAPPDATA 'Programs\iWinInstaller'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'iWinInstaller.lnk'
          "Instalado: $(Test-Path "$d\iWinInstaller.ps1") · versión: $(Get-Content "$d\instalado.txt" -ErrorAction SilentlyContinue) · acceso directo: $(Test-Path $lnk)" | Tee-Object resultados\8-instalador.txt -Append
      - name: Conservar resultados de prueba
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultados-windows
          path: resultados/

name: Publicar versión
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar'
        required: true
permissions:
  contents: write
  checks: read
  # Procedencia firmada de cada descarga (gh attestation verify)
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compilar el EXE y preparar notas
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tag=$env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+$') { throw 'Tag no valido' }
          git fetch -q --tags origin
          git rev-parse -q --verify "refs/tags/$tag" *> $null
          if ($LASTEXITCODE) {
            # Publicación a mano sin tag: se crea sobre el commit lanzado
            git tag $tag $env:GITHUB_SHA
            git push -q origin "refs/tags/$tag"
            if ($LASTEXITCODE) { throw 'No se pudo crear el tag' }
          }
          git checkout -q $tag
          if ($LASTEXITCODE) { throw 'El tag debe existir antes de publicar' }
          $commit=(git rev-parse HEAD).Trim()
          $env:GH_TOKEN=$env:GITHUB_TOKEN
          $checks=(gh api "repos/$env:GITHUB_REPOSITORY/commits/$commit/check-runs?per_page=100" | ConvertFrom-Json).check_runs
          if($LASTEXITCODE){throw 'No se pudieron comprobar las pruebas previas a publicación'}
          foreach($required in @('bootstrap (windows-2025)','bootstrap (windows-11-arm)','acceptance (windows-2025)','acceptance (windows-11-arm)','native (windows-2025)','native (windows-11-arm)')){
            $check=$checks | Where-Object name -eq $required | Sort-Object started_at -Descending | Select-Object -First 1
            if(-not $check -or $check.conclusion -ne 'success'){throw "Publicación detenida: falta la prueba correcta $required para $commit"}
          }
          $output=Join-Path $env:RUNNER_TEMP 'release'
          ./scripts/build_exe.ps1 -OutputDirectory $output -Ref $tag
          Copy-Item install.ps1 $output
          $content=Get-Content CHANGELOG.md -Raw
          $entry=($content -split "(?m)^## $([regex]::Escape($tag)) [^\r\n]*\r?\n",2)[1]
          $entry=($entry -split '(?m)^## v',2)[0]
          $entry+="`n## Descargar e instalar`nDescarga **iWinInstaller-Setup.exe** y abrelo con doble clic. Incluye la app, winget y sus dependencias de Microsoft. Alternativa ZIP: descomprime iWinInstaller.zip y abre iWinInstaller.exe; la primera apertura registra la misma instalación de Windows.`n`n[Codigo de esta version](https://github.com/iShun05/iWinInstaller/tree/$tag) · [Historial completo](https://github.com/iShun05/iWinInstaller/blob/main/CHANGELOG.md)`n"
          $entry | Set-Content (Join-Path $output 'notas.md') -Encoding UTF8
          "OUTPUT=$output" >> $env:GITHUB_ENV
      - name: Firmar la procedencia de las descargas
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.OUTPUT }}/iWinInstaller-Setup.exe
            ${{ env.OUTPUT }}/iWinInstaller.zip
            ${{ env.OUTPUT }}/install.ps1
      - name: Publicar descarga lista para usar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag=$env:RELEASE_TAG
          $files=@((Join-Path $env:OUTPUT 'iWinInstaller-Setup.exe'),(Join-Path $env:OUTPUT 'iWinInstaller.zip'),(Join-Path $env:OUTPUT 'install.ps1'))
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag @files --clobber }
          else { gh release create $tag @files --verify-tag --title "iWinInstaller $tag" --notes-file (Join-Path $env:OUTPUT 'notas.md') --latest }
          if ($LASTEXITCODE) { throw 'No se pudo publicar' }
          gh release edit $tag --title "iWinInstaller $tag" --notes-file (Join-Path $env:OUTPUT 'notas.md') --latest
          if ($LASTEXITCODE) { throw 'No se pudieron actualizar las notas' }

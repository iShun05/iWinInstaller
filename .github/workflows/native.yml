name: Ejecutable y estabilidad
on:
  push:
    branches: [main, 'codex/**']
    paths: ['*.ps1', 'apps.json', 'profiles.json', 'native/**', 'scripts/**', 'tests/**', 'installer-header.bat', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Iconos defectuosos y cierre del dispatcher
        shell: powershell
        run: ./tests/check-icons.ps1
      - name: Compilar e instalar el EXE completo
        shell: pwsh
        run: ./tests/check-native.ps1
      - name: Reunir diagnóstico
        if: always()
        shell: pwsh
        run: |
          $destination=Join-Path $env:RUNNER_TEMP 'iwin-native/diagnostico'
          New-Item $destination -ItemType Directory -Force | Out-Null
          Copy-Item "$env:LOCALAPPDATA/iWinInstaller/arranque-*.log" $destination -ErrorAction SilentlyContinue
      - name: Conservar ejecutables y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejecutable-windows-${{ matrix.os }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/iwin-native/iWinInstaller-Setup.exe
            ${{ runner.temp }}/iwin-native/iWinInstaller.zip
            ${{ runner.temp }}/iwin-native/diagnostico/
            ${{ runner.temp }}/iwin-ui/
